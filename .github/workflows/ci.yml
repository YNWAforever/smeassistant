name: CI

# Same gate order as upstream sme-scanner (CLAUDE.md Phase 7): install, lint,
# typecheck, unit, secret boundary, verify-migrations (postgresql-16),
# integration (Docker), build, e2e on fixtures. Nothing here reaches a paid
# provider or any shared database: SCAN_SOURCES=fixture and the
# integration suite runs against its own owned Postgres containers.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCAN_SOURCES: fixture
      VITEST_MAX_WORKERS: 1
      NEON_INTEGRATION: 1
      RATE_LIMIT_SECRET: ci-rate-limit-secret-not-for-production
      NEXT_PUBLIC_SITE_URL: http://localhost:3100

    steps:
      - uses: actions/checkout@v4

      # Installs the pnpm pinned by `packageManager`; must precede setup-node so
      # `cache: pnpm` can resolve the store (see upstream's ci.yml for why a bare
      # `corepack enable` does not work here).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Assert server secrets never reach the client
        run: pnpm test:secret-boundary

      - name: Assert retired transport is absent
        run: pnpm test:no-supabase

      - name: Assert self-service ownership claim stays disabled
        run: pnpm test:no-self-service-claim

      - name: Prepare owned PostgreSQL fixture image
        run: docker pull postgres:16

      - name: Verify migrations
        run: pnpm db:verify

      - name: Integration tests (owned Docker PostgreSQL)
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm e2e

      - name: Required merchant acceptance (isolated Auth, database, mail and LLM)
        run: pnpm e2e:acceptance

      # Diagnostics for intermittent acceptance failures (for example merchant-loop
      # `read ECONNRESET`, which does not reproduce off the Linux runner). Both steps
      # run only when an earlier step failed. Everything printed or uploaded is
      # local fixture data from the isolated environment, never a real secret.
      - name: Acceptance dev-server log tail (on failure)
        if: failure()
        run: tail -n 400 test-results/fixture-next.log || echo "no dev-server log"

      - name: Upload acceptance results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
